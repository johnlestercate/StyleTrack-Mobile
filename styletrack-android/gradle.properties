org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the StyleTrack API lives.
#  - Android emulator -> your computer:  http://10.0.2.2:<port>/api/   (10.0.2.2 is the emulator's name for your computer)
#  - Real phone on the same Wi-Fi:       http://<your-computer-LAN-IP>:<port>/api/
#  - Deployed server:                    https://your-domain/api/
# The trailing slash is required. Override per build with:  ./gradlew assembleDebug -PapiBaseUrl=http://192.168.1.20:8081/api/
apiBaseUrl=http://10.0.2.2:8081/api/
